version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: helio_db  # <--- FIXED NAME
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb # <--- FIXES UNNAMED VOLUME
    networks:
      - helio_net

  server:
    build: ./server
    container_name: helio_server # <--- FIXED NAME
    ports:
      - "${SERVER_PORT}:5000"
    environment:
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASS}@helio_db:27017/admin # Use container_name here
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./server:/app
      - server_modules:/app/node_modules
    depends_on:
      - mongo
    networks:
      - helio_net

  client:
    build: ./client
    container_name: helio_client # <--- FIXED NAME
    ports:
      - "${CLIENT_PORT}:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./client:/app
      - client_modules:/app/node_modules
    networks:
      - helio_net

# Define explicit names for ALL persistent data
volumes:
  mongo_data:
    name: ${PROJECT_NAME}_mongo_data
  mongo_config:
    name: ${PROJECT_NAME}_mongo_config # <--- NEW NAMED VOLUME
  server_modules:
    name: ${PROJECT_NAME}_server_node_modules
  client_modules:
    name: ${PROJECT_NAME}_client_node_modules

networks:
  helio_net:
    driver: bridge