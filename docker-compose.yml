services:
  mongo:
    image: mongo:latest
    container_name: helio_db  # <--- FIXED NAME
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb # <--- FIXES UNNAMED VOLUME
    networks:
      - helio_net

  server:
    build: ./server
    container_name: helio_server # <--- FIXED NAME
    ports:
      - "${SERVER_PORT}:5000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/admin
    # volumes:
    #   # - ./server:/app # <--- Disabled for 'watch' mode performance.
    #   # - server_modules:/app/node_modules
    depends_on:
      - mongo
    networks:
      - helio_net

    # --- WATCH MODE CONFIGURATION ---
    # This 'develop' section enables 'docker compose watch'.
    # It replaces legacy bind mounts for better performance and automatic rebuilding.
    develop:
      watch:
        # SYNC: Hot-reload code changes instantly
        - action: sync
          path: ./server
          target: /app
          ignore:
            - node_modules/
        # REBUILD: Rebuild container when dependencies change
        - action: rebuild
          path: ./server/package.json

  client:
    build: ./client
    container_name: helio_client # <--- FIXED NAME
    ports:
      - "${CLIENT_PORT}:5173"
    env_file:
      - .env
    # volumes:
      # NOTE: Bind mounts are DISABLED for 'watch' mode to improve performance on macOS/Windows.
      # File syncing is handled by the 'develop' section below.
      # - ./client:/app 
      # - client_modules:/app/node_modules 
    networks:
      - helio_net
    
    # --- WATCH MODE CONFIGURATION ---
    develop:
      watch:
        # SYNC: Hot-reload code changes instantly
        - action: sync
          path: ./client
          target: /app
          ignore:
            - node_modules/
        # REBUILD: Rebuild container when dependencies change
        - action: rebuild
          path: ./client/package.json

# Define explicit names for ALL persistent data
volumes:
  mongo_data:
    name: ${PROJECT_NAME}_mongo_data
  mongo_config:
    name: ${PROJECT_NAME}_mongo_config # <--- NEW NAMED VOLUME
  # server_modules:
  #   name: ${PROJECT_NAME}_server_node_modules
  # client_modules:
  #   name: ${PROJECT_NAME}_client_node_modules

networks:
  helio_net:
    driver: bridge